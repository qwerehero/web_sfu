<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Регистрация автомобиля для продажи</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 24px 16px; background: #eef2f6; color: #1c2733; font: 14px/1.5 "Segoe UI", Roboto, Arial, sans-serif; }
form { max-width: 820px; margin: 0 auto; padding: 24px 28px; background: #fff; border-radius: 10px; box-shadow: 0 2px 10px rgba(28, 39, 51, 0.1); }
h1 { margin: 0 0 16px; font-size: 22px; color: #1f4e79; }
fieldset { margin: 0 0 20px; padding: 14px 18px 6px; border: 1px solid #c5d0db; border-radius: 8px; }
legend { padding: 0 8px; font-weight: bold; color: #1f4e79; }
.row { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
.row > label:first-child, .row > .grp { flex: 0 0 210px; }
input[type="text"], input[type="number"], input[type="tel"], input[type="email"], select, textarea { flex: 1; width: 100%; padding: 8px 10px; border: 1px solid #9aa8b6; border-radius: 6px; font: inherit; }
input:focus, select:focus, textarea:focus { outline: 2px solid #e0b400; border-color: #1f4e79; }
textarea { min-height: 90px; resize: vertical; }
input[type="color"] { width: 56px; height: 34px; padding: 2px; border: 1px solid #9aa8b6; border-radius: 6px; }
input[type="range"] { flex: 1; }
.opts { display: flex; flex-wrap: wrap; gap: 6px 18px; }
.opts label { display: inline-flex; align-items: center; gap: 6px; }
.buttons { display: flex; gap: 12px; justify-content: flex-end; }
button { padding: 10px 22px; border: 0; border-radius: 6px; font: inherit; font-weight: bold; cursor: pointer; }
button[type="submit"] { background: #1f4e79; color: #fff; }
button[type="reset"] { background: #e6edf4; color: #1f4e79; }

/* Мобильная версия: подписи убираем, остаются placeholder */
@media (max-width: 767px) {
  body { padding: 0; background: #fff; }
  form { padding: 16px; border-radius: 0; box-shadow: none; }
  fieldset { padding: 12px 12px 2px; }
  .row { flex-direction: column; align-items: stretch; gap: 6px; }
  .lbl { display: none; }
  .row > .grp { flex: 0 0 auto; font-weight: bold; }
  .buttons { flex-direction: column-reverse; }
  button { width: 100%; padding: 14px; }
}
</style>
</head>
<body>
<form action="#" method="post" oninput="powerOut.value = power.value">
<h1>Регистрация автомобиля для продажи</h1>

<fieldset>
<legend>Автомобиль</legend>
<div class="row">
  <label class="lbl" for="brand">Марка</label>
  <input type="text" id="brand" name="brand" list="brands" placeholder="Марка" aria-label="Марка" required>
  <datalist id="brands"><option value="Toyota"><option value="Volkswagen"><option value="Lada"><option value="Kia"><option value="BMW"></datalist>
</div>
<div class="row">
  <label class="lbl" for="model">Модель</label>
  <input type="text" id="model" name="model" placeholder="Модель" aria-label="Модель" required>
</div>
<div class="row">
  <label class="lbl" for="year">Год выпуска</label>
  <input type="number" id="year" name="year" min="1950" max="2026" placeholder="Год выпуска" aria-label="Год выпуска" required>
</div>
<div class="row">
  <label class="lbl" for="mileage">Пробег, км</label>
  <input type="number" id="mileage" name="mileage" min="0" step="1000" placeholder="Пробег, км" aria-label="Пробег, км">
</div>
<div class="row">
  <label class="lbl" for="body">Тип кузова</label>
  <select id="body" name="body" aria-label="Тип кузова" required>
    <option value="" disabled selected hidden>Тип кузова</option>
    <optgroup label="Легковые"><option>Седан</option><option>Хэтчбек</option><option>Универсал</option></optgroup>
    <optgroup label="Внедорожники"><option>Кроссовер</option><option>Внедорожник</option><option>Пикап</option></optgroup>
  </select>
</div>
<div class="row">
  <span class="grp">Коробка передач</span>
  <div class="opts">
    <label><input type="radio" name="gearbox" value="mt" checked> Механика</label>
    <label><input type="radio" name="gearbox" value="at"> Автомат</label>
    <label><input type="radio" name="gearbox" value="cvt"> Вариатор</label>
  </div>
</div>
<div class="row">
  <label for="color">Цвет кузова</label>
  <input type="color" id="color" name="color" value="#1f4e79">
</div>
<div class="row">
  <label class="lbl" for="vin">VIN-номер</label>
  <input type="text" id="vin" name="vin" pattern="[A-HJ-NPR-Z0-9]{17}" maxlength="17" placeholder="VIN-номер (17 символов)" aria-label="VIN-номер">
</div>
<div class="row">
  <label for="power">Мощность, л. с.</label>
  <input type="range" id="power" name="power" min="50" max="500" step="10" value="150">
  <output name="powerOut" for="power">150</output>
</div>
<div class="row">
  <span class="grp">Состояние</span>
  <div class="opts">
    <label><input type="checkbox" name="cond" value="nocrash"> Не бит</label>
    <label><input type="checkbox" name="cond" value="owner"> Один владелец</label>
    <label><input type="checkbox" name="cond" value="service"> Сервисная книжка</label>
  </div>
</div>
</fieldset>

<fieldset>
<legend>Цена и описание</legend>
<div class="row">
  <label class="lbl" for="price">Цена, ₽</label>
  <input type="number" id="price" name="price" min="0" step="1000" placeholder="Цена, ₽" aria-label="Цена, ₽" required>
</div>
<div class="row">
  <span class="grp">Торг</span>
  <div class="opts"><label><input type="checkbox" name="bargain"> Возможен торг</label></div>
</div>
<div class="row">
  <label class="lbl" for="about">Описание</label>
  <textarea id="about" name="about" placeholder="Описание автомобиля" aria-label="Описание"></textarea>
</div>
<div class="row">
  <label for="photos">Фотографии</label>
  <input type="file" id="photos" name="photos" accept="image/*" multiple>
</div>
</fieldset>

<fieldset>
<legend>Контакты продавца</legend>
<div class="row">
  <label class="lbl" for="name">Имя</label>
  <input type="text" id="name" name="name" autocomplete="name" placeholder="Ваше имя" aria-label="Имя" required>
</div>
<div class="row">
  <label class="lbl" for="phone">Телефон</label>
  <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="Телефон" aria-label="Телефон" required>
</div>
<div class="row">
  <label class="lbl" for="email">Email</label>
  <input type="email" id="email" name="email" autocomplete="email" placeholder="Email" aria-label="Email">
</div>
<div class="row">
  <span class="grp">Согласие</span>
  <div class="opts"><label><input type="checkbox" name="agree" required> Согласен на обработку данных</label></div>
</div>
</fieldset>

<div class="buttons">
  <button type="reset">Очистить</button>
  <button type="submit">Разместить объявление</button>
</div>
</form>
</body>
</html>
