<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой первый проект</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #252526;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            border: 1px solid #3c3c3c;
        }
        h1 {
            color: #4fc1ff;
            margin-top: 0;
        }
        p {
            color: #cccccc;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            background-color: #007acc;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            margin-top: 15px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #0062a3;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Всё работает! 🎉</h1>
        <p>Эта простая HTML-страница создана для проверки вашего первого репозитория в VS Code.</p>
        <p>Стили оформлены в темных тонах, прямо как интерфейс вашей любимой среды разработки.</p>
        <a href="https://github.com" target="_blank" class="btn">Перейти на GitHub</a>
    </div>

</body>
</html>
